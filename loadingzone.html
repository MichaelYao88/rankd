<!doctype html>
<html lang="en">
<head>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="favicon.svg">
  <meta property="og:site_name" content="Rankd">
  <meta property="og:title" content="Loading Zone · Ranki.gg">
  <meta name="theme-color" content="#3B5BFF">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Loading Zone · Ranki.gg</title>
<meta name="color-scheme" content="light dark">
<link rel="stylesheet" href="studio.css">
</head>
<body>
<!-- Loading Zone: owner preview of scheduled days + datasets. Unlinked, noindexed. Sandboxed preview play. -->
<p class="lz-banner" style="margin:0;padding:10px 16px;background:rgba(59,91,255,.1);font:600 13px/1.4 system-ui,sans-serif;color:inherit">
  Preview tools for Ranki — opens puzzles in a sandboxed preview that <b>doesn't count</b> toward stats or streaks.
  <a href="index.html" style="margin-left:.5rem">← Back to Ranki.gg</a>
</p>
<header class="top">
  <h1>Loading Zone</h1>
  <nav class="tabs" role="tablist">
    <button role="tab" id="tabPreview" aria-selected="true">Preview</button>
    <button role="tab" id="tabData" aria-selected="false">Datasets</button>
  </nav>
</header>
<main>
  <section id="previewView">
    <p class="note" id="pvNote"></p>
    <div class="lz-tools">
      <div class="lz-search">
        <input id="daySearch" type="search" placeholder="Search countries, headlines, sources…" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="search" aria-label="Search puzzles" aria-controls="days">
        <button type="button" id="daySearchClear" class="lz-search-clear" aria-label="Clear search" hidden>×</button>
      </div>
      <p class="lz-count" id="dayCount" aria-live="polite"></p>
    </div>
    <p class="lz-empty hidden" id="dayEmpty" role="status"></p>
    <ol class="days" id="days"></ol>
  </section>
  <section id="dataView" class="hidden">
    <p class="note" id="dsNote"></p>
    <ul class="sets" id="sets"></ul>
  </section>
</main>
<script>window.RANKD_STUDIO = true;</script>
<script src="puzzles-data.js"></script>
<script src="practice-data.js"></script>
<script src="puzzle-search.js"></script>
<script src="app.js"></script>
<script src="studio.js"></script>
</body>
</html>
